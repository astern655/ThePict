# Render 배포 청사진 (Blueprint). 대시보드에서 "New +" → "Blueprint" → 이 저장소 선택.
#
# 무료 티어로 뜨는 "가벼운 백엔드"다. 인증·세션·프로그램·문장분석 API가 전부 동작한다.
# 무거운 AI 엔진(torch/ultralytics/opencv)은 무료 티어 메모리·빌드시간을 넘겨 설치하지
# 않는다 → /inference/video 와 /inference/stream 만 503/engine_unavailable 을 낸다.
# (자세 판정 자체가 GPU/대용량 RAM을 요구해 무료 웹서비스에 맞지 않는다.)
#
# ⚠️ 저장소는 SQLite 파일(hohowatt.db)이다. 무료 티어 디스크는 휘발성이라
#    재배포·15분 유휴 후 슬립→콜드스타트 때 계정·기록이 사라진다. 데모/APK 연결
#    테스트엔 충분하지만, 유지가 필요하면 아래 둘 중 하나:
#      (a) 유료 인스턴스 + Render Disk 를 붙이고 HOHOWATT_DB 를 마운트 경로로.
#      (b) Render 무료 Postgres 로 이전(코드 변경 필요 — 요청 시 작업).

services:
  - type: web
    name: thefit-backend
    runtime: python
    plan: free
    rootDir: backend           # 빌드·실행을 backend/ 에서. requirements/main.py 가 여기 있다.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: POSE_ESTIMATOR
        value: stub            # 실시간 프레임 판정 추정기. AI 미설치 환경 기본값.
      # HOHOWATT_DB 를 안 주면 backend/hohowatt.db 를 쓴다(휘발성 — 위 경고 참고).
