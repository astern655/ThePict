name: app
description: YOLO-pose 헬스 자세 교정 앱 (프론트엔드 MVP)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # 운동 영상을 골라 /inference/video(AI 엔진)로 올리기 위한 것.
  # 웹은 image_picker_for_web이 자동으로 물리고, 모바일은 플랫폼 폴더가 필요하다
  # (`flutter create .` 로 생성).
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
